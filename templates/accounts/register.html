{% extends "base/base.html" %}

{% block title %}تسجيل طالب{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="bg-white border nebras-card p-4">
            <h1 class="h4 mb-3">تسجيل طالب جديد</h1>
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">إرسال التسجيل</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
