{% extends "base/base.html" %}

{% block title %}تسجيل طالب{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="nebras-card auth-card p-4">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
                <h1 class="h4 mb-2">تسجيل طالب جديد</h1>
                <p class="text-muted mb-0">سيبقى الحساب قيد المراجعة حتى موافقة الإدارة أو المعلم.</p>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">إرسال التسجيل</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
