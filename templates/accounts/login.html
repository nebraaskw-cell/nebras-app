{% extends "base/base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="nebras-card auth-card p-4">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="bi bi-shield-lock"></i></div>
                <h1 class="h4 mb-2">تسجيل الدخول</h1>
                <p class="text-muted mb-0">ادخل إلى لوحة حلقات نبراس حسب دورك.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100" type="submit">دخول</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
