<div class="page-header">
    <div>
        {% if eyebrow %}
            <div class="page-eyebrow">{{ eyebrow }}</div>
        {% endif %}
        <h1>{{ title }}</h1>
        {% if subtitle %}
            <p>{{ subtitle }}</p>
        {% endif %}
    </div>
    {% if action_url and action_label %}
        <a class="btn btn-primary" href="{{ action_url }}">
            {% if action_icon %}<i class="bi {{ action_icon }}"></i>{% endif %}
            {{ action_label }}
        </a>
    {% endif %}
</div>
