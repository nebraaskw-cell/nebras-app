{% extends "base/base.html" %}
{% load static %}

{% block title %}المحادثات{% endblock %}

{% block content %}
<div class="row g-0 nebras-card overflow-hidden chat-shell">
    <!-- Rooms Sidebar -->
    <div class="col-md-4 border-end h-100 bg-light bg-opacity-50">
        <div class="p-3 border-bottom bg-white">
            <h5 class="mb-0 fw-bold">غرف المحادثة</h5>
        </div>
        <div class="overflow-auto" style="height: calc(100% - 60px);" id="roomList">
            <!-- Rooms will be loaded here -->
            <div class="text-center p-5 text-muted">
                <div class="spinner-border spinner-border-sm mb-2"></div>
                <p>جاري تحميل الغرف...</p>
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="col-md-8 d-flex flex-column h-100">
        <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center" id="chatHeader">
            <h5 class="mb-0 fw-bold text-primary" id="activeRoomName">اختر محادثة للبدء</h5>
        </div>

        <div class="flex-grow-1 overflow-auto p-3 d-flex flex-column" id="messageContainer" style="background: #fdfdfd;">
            <div class="text-center text-muted my-auto" id="noChatSelected">
                <i class="bi bi-chat-dots fs-1 mb-2 d-block"></i>
                <p>تواصل مع زملائك ومعلميك في الغرف المتاحة</p>
            </div>
        </div>

        <div class="p-3 border-top bg-white d-none" id="inputArea">
            <form id="messageForm" class="d-flex gap-2">
                <input type="text" id="messageInput" class="form-control rounded-pill border-primary" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button type="submit" class="btn btn-primary rounded-circle">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
window.nebrasChatConfig = { currentUserId: {{ request.user.id }} };
</script>
<script src="{% static 'js/chat.js' %}"></script>
{% endblock %}
