{% extends "admin/base.html" %}
{% load static %}

{% block title %}حلقات نبراس | إدارة النظام{% endblock %}

{% block branding %}
<a class="brand-logo text-decoration-none" href="{% url 'admin:index' %}">
    <span class="brand-icon"><i class="bi bi-stars"></i></span>
    <span class="brand-title">حلقات نبراس</span>
</a>
{% endblock %}

{% block nav-global %}
{{ block.super }}
{% endblock %}

{% block extrahead %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/site.css' %}" rel="stylesheet">
<style>
/* Admin theme alignment with Nebras brand */
body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef3f4 100%);
}
#header {
    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 5px 18px rgba(15, 23, 42, 0.06);
}
#branding {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
.brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    color: #144a52;
    font-weight: 700;
}
.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #144a52, #b38a2e);
    color: #fff;
}
#user-tools a,
#user-tools a:visited,
#user-tools a:hover {
    color: #144a52;
}
#content h1, #content h2, #content h3, #content h4 {
    color: #0b2e33;
}
.module, .dashboard-module {
    background: rgba(255,255,255,0.94);
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);
}
.submit-row input[type=submit], .button, button {
    border-radius: 8px !important;
    background-color: #144a52 !important;
    border-color: #144a52 !important;
    color: #fff !important;
}
.submit-row input[type=submit]:hover, .button:hover, button:hover {
    background-color: #1e6a75 !important;
    border-color: #1e6a75 !important;
}
table {
    border-color: #e2e8f0 !important;
}
th {
    background: #f8fafc !important;
    color: #0b2e33 !important;
}
</style>
{% endblock %}
